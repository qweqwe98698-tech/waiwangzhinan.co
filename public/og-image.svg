<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0C" />
      <stop offset="50%" stop-color="#0F1318" />
      <stop offset="100%" stop-color="#080A0C" />
    </linearGradient>

    <!-- Mint Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64F5B3" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow Effect -->
    <radialGradient id="glow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#64F5B3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#64F5B3" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glowBlue" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glowBlue)" />

  <!-- Outer Border -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Brand Logo Icon & Text -->
  <g transform="translate(100, 110)">
    <!-- Custom Node Compass Icon -->
    <circle cx="45" cy="45" r="40" fill="#161B22" stroke="#64F5B3" stroke-width="2" />
    <path d="M45 22 L52 38 L68 45 L52 52 L45 68 L38 52 L22 45 L38 38 Z" fill="url(#brandGrad)" />
    <circle cx="45" cy="45" r="5" fill="#080A0C" />
    
    <!-- Title -->
    <text x="110" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="44" font-weight="900" fill="#F5F7F8" letter-spacing="-1">
      外网指南
    </text>
    <text x="110" y="76" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="20" font-weight="600" fill="#64F5B3" letter-spacing="1">
      waiwangzhinan.co
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(100, 260)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      零基础海外网络访问 · 交互式知识导航系统
    </text>
    <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="400" fill="#8B949E" letter-spacing="0.2">
      专线协议实测 · 客户端极简上手 · 常见网络故障一键排查 · 每日开源动态工具箱
    </text>
  </g>

  <!-- 4 Feature Badges at Bottom -->
  <g transform="translate(100, 420)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="230" height="72" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="24" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#64F5B3">⚡ IEPL / IPLC</text>
      <text x="24" y="54" font-family="sans-serif" font-size="13" fill="#8B949E">企业专线网络实测</text>
    </g>

    <!-- Badge 2 -->
    <g transform="translate(250, 0)">
      <rect width="230" height="72" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="24" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#3B82F6">📱 全平台客户端</text>
      <text x="24" y="54" font-family="sans-serif" font-size="13" fill="#8B949E">Clash / 小火箭教程</text>
    </g>

    <!-- Badge 3 -->
    <g transform="translate(500, 0)">
      <rect width="230" height="72" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="24" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#64F5B3">🔬 E-E-A-T 实验室</text>
      <text x="24" y="54" font-family="sans-serif" font-size="13" fill="#8B949E">电信/联通真机核验</text>
    </g>

    <!-- Badge 4 -->
    <g transform="translate(750, 0)">
      <rect width="250" height="72" rx="14" fill="#161B22" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="24" y="34" font-family="sans-serif" font-size="14" font-weight="700" fill="#3B82F6">🛠️ 本地网络工具箱</text>
      <text x="24" y="54" font-family="sans-serif" font-size="13" fill="#8B949E">订阅体检与美区 ID 池</text>
    </g>
  </g>
</svg>
